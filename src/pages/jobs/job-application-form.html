<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/55174c58a9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="job-application-form.css" />
    <script type="module" src="job-application-form.js" defer></script>
    <title>JobbPortalen | Jobb</title>
  </head>
  <body>
    <header></header>
    <main class="container">
      <h1></h1>

      <article>
        <aside></aside>
        <section class="content">
          <section class="message"></section>
          <form id="application-form">
            <textarea
              id="letter"
              name="letter"
              rows="15"
              placeholder="Berätta lite om dig själv och varför du söker tjänsten..."
              required
            ></textarea>

            <button id="${id}" type="submit" class="btn btn-rounded">
              <i class="fa-regular fa-file-lines"></i>
              Ansök
            </button>
          </form>
        </section>
      </article>
    </main>
  </body>
</html>
