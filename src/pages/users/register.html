<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/55174c58a9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="users.css" />
    <script type="module" src="register.js" defer></script>
    <title>JobbPortalen | Registrering</title>
  </head>
  <body>
    <header></header>
    <main class="container">
      <h1>Skapa konto</h1>
      <section class="message"></section>
      <form>
        <div class="form-radio">
          <input type="radio" id="employee" name="role" value="employee" checked />
          <label class="radio-label" for="employee">Arbetssökande</label>
        </div>
        <div class="form-radio">
          <input type="radio" id="employer" name="role" value="employer" />
          <label class="radio-label" for="employer">Arbetsgivare</label>
        </div>

        <div class="form-controls" id="firstName-field">
          <input required="text" name="firstName" id="firstName" />
          <label for="firstName">Förnamn</label>
        </div>
        <div class="form-controls" id="lastName-field">
          <input required type="text" name="lastName" id="lastName" />
          <label for="lastName">Efternamn</label>
        </div>
        <div class="form-controls" id="employerName-field">
          <input type="text" name="employerName" id="employerName" />
          <label for="employerName">Företag</label>
        </div>

        <div class="form-controls">
          <input required type="text" name="email" id="email" />
          <label for="email">E-Post</label>
        </div>
        <div class="form-controls">
          <input required type="password" name="password" id="password" />
          <label for="password">Lösenord</label>
        </div>
        <button class="btn btn-rounded">Registrera</button>
      </form>
    </main>
  </body>
</html>
